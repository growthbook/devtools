<!doctype html>
<html>
  <head>
    <title>GB DevTools - trackingCallback param counts</title>
    <style>
      body {
        font: 14px/1.5 system-ui;
        max-width: 680px;
        margin: 40px auto;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        margin-right: 8px;
      }
      pre {
        background: #f4f4f5;
        padding: 12px;
        overflow-x: auto;
      }
      .status {
        font-weight: 600;
      }
      nav a {
        display: inline-block;
        margin-right: 10px;
        padding: 4px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        text-decoration: none;
        color: #111;
      }
      nav a.on {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      code.sig {
        background: #f4f4f5;
        padding: 2px 5px;
      }
    </style>
  </head>
  <body>
    <h1>trackingCallback param counts</h1>

    <nav>
      <a href="?params=2" id="l2">2 params</a>
      <a href="?params=3" id="l3">3 params</a>
      <a href="?params=1" id="l1">1 param (should warn)</a>
      <a href="?params=4" id="l4">4 params (should warn)</a>
    </nav>
    <nav style="margin-top: 8px">
      <a href="#" id="ofuToggle"
        >onFeatureUsage: <span id="ofuState">off</span></a
      >
    </nav>

    <p>Active signature: <code class="sig" id="sig">-</code></p>
    <p>SDK payload: <span class="status" id="conn">loading&hellip;</span></p>
    <p>
      <button id="run">Run experiment</button>
      <button id="feat">Evaluate feature</button>
    </p>
    <pre id="out">(no calls yet)</pre>

    <script src="./growthbook.js"></script>
    <script>
      const out = document.getElementById("out");
      const lines = [];
      function log(msg) {
        lines.push(msg);
        out.textContent = lines.join("\n");
      }

      const qs = new URLSearchParams(location.search);
      const n = qs.get("params") || "3";
      document.getElementById("l" + n)?.classList.add("on");

      const ofuOn = qs.get("ofu") === "1";
      const ofuLink = document.getElementById("ofuToggle");
      document.getElementById("ofuState").textContent = ofuOn ? "ON" : "off";
      if (ofuOn) ofuLink.classList.add("on");
      ofuLink.addEventListener("click", (e) => {
        e.preventDefault();
        const next = new URLSearchParams(location.search);
        if (ofuOn) next.delete("ofu");
        else next.set("ofu", "1");
        location.search = next.toString();
      });

      function report(experiment, result, userContext) {
        log(
          `trackingCallback: ${experiment.key} -> ${result.variationId} ` +
            `(userContext: ${userContext ? "present" : "undefined"})`,
        );
      }

      // Each variant is written out longhand so the real declared arity is
      // what DevTools reads off Function.prototype.toString().
      const callbacks = {
        1: (experiment) => report(experiment, { variationId: "?" }),
        2: (experiment, result) => report(experiment, result),
        3: (experiment, result, userContext) =>
          report(experiment, result, userContext),
        4: (experiment, result, userContext, extra) =>
          report(experiment, result, userContext),
      };
      const trackingCallback = callbacks[n] || callbacks["3"];
      document.getElementById("sig").textContent =
        "(" +
        (trackingCallback.toString().match(/^\(?([^)]*)\)?\s*=>/)?.[1] || "?") +
        ")";

      const gb = new growthbook.GrowthBook({
        // Served by this same static server from ./api/features/local-test,
        // which is exactly the URL DevTools probes for its "Connected" check.
        apiHost: window.location.origin,
        clientKey: "local-test",
        enableDevMode: true,
        attributes: { id: "user-123", country: "US" },
        trackingCallback,

        // Toggled by ?ofu=1 - flips "On Feature Usage Callback" to Yes.
        ...(ofuOn
          ? {
              onFeatureUsage: (key, result, userContext) => {
                log(
                  `onFeatureUsage: ${key} = ${JSON.stringify(result.value)} ` +
                    `(userContext: ${userContext ? "present" : "undefined"})`,
                );
              },
            }
          : {}),
      });

      // What the SDK's auto-wrapper normally does - DevTools looks for both.
      window._growthbook = gb;

      gb.init({ streaming: false })
        .then((res) => {
          document.getElementById("conn").textContent = res.success
            ? `loaded from ${res.source}`
            : `failed: ${res.error?.message || "unknown"}`;
          log(
            `features: ${Object.keys(gb.getFeatures()).join(", ") || "(none)"}`,
          );
        })
        .catch((e) => {
          document.getElementById("conn").textContent = `error: ${e.message}`;
        })
        .finally(() => {
          // Tell DevTools the instance is ready, after the payload has landed.
          document.dispatchEvent(new CustomEvent("gbloaded"));
        });

      document.getElementById("run").addEventListener("click", () => {
        gb.run({ key: "manual-experiment", variations: [0, 1] });
      });
      document.getElementById("feat").addEventListener("click", () => {
        log(
          `my-feature = ${JSON.stringify(gb.getFeatureValue("my-feature", "off"))}`,
        );
        log(
          `banner-color = ${JSON.stringify(gb.getFeatureValue("banner-color", "none"))}`,
        );
      });
    </script>
  </body>
</html>
